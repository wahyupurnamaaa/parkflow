name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================
  # JOB 1: Test & Build Quality Check
  # ===========================================
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend Tests
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pdo_sqlite, redis

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Install Backend Dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Run Backend Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
        working-directory: backend

      # Frontend Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Check
        run: npm run typecheck
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api-parkflow.wahyupurnamaa.com

  # ===========================================
  # JOB 2: Deploy Frontend to Vercel
  # ===========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ===========================================
  # JOB 3: Deploy Backend to AWS EC2
  # ===========================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.AWS_EC2_HOST }} << 'ENDSSH'
            set -e

            echo "🚀 Starting ParkFlow Backend Deployment..."

            # Navigate to project
            cd /var/www/parkflow

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Build and start containers with production compose
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for containers to be ready..."
            sleep 15

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

            # Clear and rebuild caches
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache

            echo "✅ Backend deployed successfully!"
            echo "🌐 API: https://api-parkflow.wahyupurnamaa.com"

            # Show status
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

  # ===========================================
  # JOB 4: Verify Deployment
  # ===========================================
  verify:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Verify Backend API
        run: |
          echo "🔍 Testing Backend API..."
          for i in 1 2 3; do
            if curl -sf https://api-parkflow.wahyupurnamaa.com/api/health; then
              echo ""
              echo "✅ Backend API is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend API health check failed"
          exit 1

      - name: Verify Frontend
        run: |
          echo "🔍 Testing Frontend..."
          for i in 1 2 3; do
            if curl -sf -o /dev/null https://parkflow.wahyupurnamaa.com; then
              echo "✅ Frontend is accessible!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Frontend check failed"
          exit 1

      - name: Deployment Summary
        run: |
          echo ""
          echo "=========================================="
          echo "✅ PARKFLOW DEPLOYMENT COMPLETE!"
          echo "=========================================="
          echo ""
          echo "🌐 Frontend: https://parkflow.wahyupurnamaa.com"
          echo "🔗 Backend:  https://api-parkflow.wahyupurnamaa.com"
          echo ""
