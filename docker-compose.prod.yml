# ===========================================
# PARKFLOW PRODUCTION DOCKER COMPOSE
# For AWS EC2 deployment
# Uses Docker Redis (free forever, no ElastiCache needed)
# ===========================================

services:
  # ===========================================
  # Redis Cache (Docker - always on)
  # ===========================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - parkflow-network

  # ===========================================
  # Backend API (Production)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: parkflow-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    environment:
      # Override Redis to use Docker container
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - parkflow-network

  # ===========================================
  # Queue Worker
  # ===========================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: parkflow-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - parkflow-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================
  # Scheduler (Laravel Task Scheduling)
  # ===========================================
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: parkflow-scheduler
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      backend:
        condition: service_started
    networks:
      - parkflow-network

networks:
  parkflow-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
